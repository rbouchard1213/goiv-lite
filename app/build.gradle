/**
 * goiv-lite: lightweight Pokemon GO IV checker.
 * Single offline flavor, modern Android (AGP 8.x, SDK 34).
 */

apply plugin: 'com.android.application'

/**
 * Store keystore properties from keystore.properties in root folder if it exists
 */
def keystoreProperties = new Properties()
if (new File('keystore.properties').exists()) {
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    keystoreProperties.keyAlias = 'your_key_alias'
    keystoreProperties.keyPassword = 'your_key_password'
    keystoreProperties.storeFile = 'your_keystore.jks'
    keystoreProperties.storePassword = 'your_keystore_password'
}

// Exclude duplicate ListenableFuture (guava vs standalone listenablefuture artifact)
configurations.all {
    exclude group: 'com.google.guava', module: 'listenablefuture'
}

android {
    namespace "com.kamron.pogoiv"
    compileSdk 34

    defaultConfig {
        applicationId "com.kamron.pogoiv"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0-lite"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

// Rename APK outputs (AGP 8 API: outputFileName is a Property)
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("goiv-lite-${variant.name}.apk")
        }
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // Utilities (kept: actively used in source)
    implementation('com.google.guava:guava:24.1-android') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // OCR: ML Kit bundled Latin text recognition (offline, no Play Services)
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Tests
    testImplementation 'junit:junit:4.13.2'
}
